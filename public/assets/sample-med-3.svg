<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Metallic Foil Background -->
  <rect width="400" height="400" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Strip Pockets 2x3 Grid -->
  <circle cx="90" cy="70" r="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="90" cy="200" r="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="90" cy="330" r="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  
  <!-- Center Text / Brand Card -->
  <rect x="145" y="30" width="225" height="340" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Red Cross / Health Emblem -->
  <rect x="165" y="50" width="30" height="30" rx="6" fill="#DC2626"/>
  <rect x="177" y="56" width="6" height="18" fill="#FFFFFF"/>
  <rect x="171" y="62" width="18" height="6" fill="#FFFFFF"/>
  
  <text x="205" y="65" fill="#DC2626" font-family="sans-serif" font-size="11" font-weight="800">FEVER &amp; PAIN RELIEF</text>
  <text x="205" y="78" fill="#64748B" font-family="sans-serif" font-size="9">FAST ACTION FORMULA</text>
  
  <text x="165" y="115" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="900">PARACETAMOL</text>
  <text x="165" y="135" fill="#0265D2" font-family="sans-serif" font-size="20" font-weight="900">650 mg</text>
  <text x="165" y="152" fill="#475569" font-family="sans-serif" font-size="10">Each uncoated tablet: Paracetamol IP 650mg</text>
  
  <line x1="165" y1="164" x2="350" y2="164" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Liver Warning Box -->
  <rect x="160" y="176" width="195" height="74" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="170" y="196" fill="#991B1B" font-family="sans-serif" font-size="10" font-weight="800">CRITICAL SAFETY WARNING:</text>
  <text x="170" y="212" fill="#7F1D1D" font-family="sans-serif" font-size="9">Do NOT exceed 4,000mg/day.</text>
  <text x="170" y="226" fill="#7F1D1D" font-family="sans-serif" font-size="9">Overdose causes severe liver damage.</text>
  <text x="170" y="240" fill="#7F1D1D" font-family="sans-serif" font-size="9">Avoid alcohol &amp; duplicate paracetamol.</text>
  
  <!-- Batch & Expiry -->
  <text x="165" y="274" fill="#0F172A" font-family="monospace" font-size="11" font-weight="700">BATCH: P650-8802</text>
  <text x="165" y="294" fill="#DC2626" font-family="monospace" font-size="13" font-weight="800">EXP: 03/2028</text>
  <text x="165" y="312" fill="#475569" font-family="sans-serif" font-size="9">Mfg: 01/2025 • MRP: ₹34.50</text>
  <text x="165" y="328" fill="#475569" font-family="sans-serif" font-size="9">Store below 30°C in dry place</text>
  <text x="165" y="348" fill="#0265D2" font-family="sans-serif" font-size="9" font-weight="700">Micro Healthcare Laboratories</text>
</svg>
